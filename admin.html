<!doctype html>

<html lang="fr">

<head>

  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <meta
    name="theme-color"
    content="#ffffff"
  >

  <title>
    Administration | Americano TC Suzini
  </title>

  <link
    rel="stylesheet"
    href="style.css"
  >


  <style>

    .admin-page {

      padding-bottom:
        20px;
    }


    .admin-login {

      margin-top:
        8px;

      padding:
        22px 18px;

      border-radius:
        18px;

      background:
        #111;

      color:
        white;

      box-shadow:
        var(--shadow);
    }


    .admin-login-kicker {

      color:
        var(--orange);

      font-size:
        9px;

      font-weight:
        900;

      letter-spacing:
        1.3px;

      text-transform:
        uppercase;
    }


    .admin-login h1 {

      margin:
        6px 0 0;

      font-size:
        30px;

      line-height:
        1;

      font-weight:
        1000;
    }


    .admin-login p {

      margin:
        8px 0 17px;

      color:
        #ccc;

      font-size:
        12px;

      line-height:
        1.4;
    }


    .admin-password {

      width:
        100%;

      min-height:
        50px;

      padding:
        12px 14px;

      border:
        2px solid #444;

      border-radius:
        13px;

      outline:
        none;

      background:
        white;

      color:
        #111;

      font:
        inherit;

      font-size:
        17px;

      font-weight:
        800;
    }


    .admin-password:focus {

      border-color:
        var(--orange);
    }


    .admin-login-btn {

      width:
        100%;

      min-height:
        50px;

      margin-top:
        9px;

      border:
        0;

      border-radius:
        13px;

      background:
        var(--orange);

      color:
        white;

      font:
        inherit;

      font-size:
        15px;

      font-weight:
        950;
    }


    .admin-error {

      display:
        none;

      margin-top:
        10px;

      padding:
        10px;

      border-radius:
        11px;

      background:
        #ffe4dc;

      color:
        #a5260d;

      font-size:
        11px;

      font-weight:
        800;
    }


    .admin-error.visible {
      display: block;
    }



    /* DASHBOARD */

    .admin-dashboard {

      display:
        none;

      padding-top:
        8px;
    }


    .admin-dashboard.visible {
      display: block;
    }


    .admin-title {

      padding:
        17px;

      border-radius:
        18px;

      background:
        linear-gradient(
          135deg,
          #111,
          #292929
        );

      color:
        white;

      box-shadow:
        var(--shadow);
    }


    .admin-title small {

      display:
        block;

      color:
        var(--orange);

      font-size:
        9px;

      font-weight:
        900;

      letter-spacing:
        1.2px;

      text-transform:
        uppercase;
    }


    .admin-title h1 {

      margin:
        5px 0 0;

      font-size:
        28px;

      line-height:
        1;

      font-weight:
        1000;
    }


    .admin-grid {

      margin-top:
        8px;

      display:
        grid;

      grid-template-columns:
        repeat(2, minmax(0,1fr));

      gap:
        8px;
    }


    .admin-card {

      min-height:
        105px;

      padding:
        14px;

      border-radius:
        16px;

      background:
        white;

      box-shadow:
        var(--shadow);

      display:
        flex;

      flex-direction:
        column;

      justify-content:
        center;
    }


    .admin-card-icon {

      margin-bottom:
        8px;

      font-size:
        26px;
    }


    .admin-card small {

      display:
        block;

      margin-bottom:
        2px;

      color:
        var(--orange);

      font-size:
        8px;

      font-weight:
        900;

      text-transform:
        uppercase;
    }


    .admin-card strong {

      font-size:
        14px;

      line-height:
        1.15;
    }


    .logout-btn {

      width:
        100%;

      min-height:
        45px;

      margin-top:
        8px;

      border:
        0;

      border-radius:
        13px;

      background:
        #eee;

      color:
        #555;

      font:
        inherit;

      font-size:
        12px;

      font-weight:
        850;
    }

  </style>

</head>


<body
  data-page="accueil"
  data-admin="true"
>


<div id="siteHeader"></div>


<main class="container admin-page">


  <!-- LOGIN -->

  <section
    id="loginArea"
    class="admin-login"
  >

    <div class="admin-login-kicker">
      Organisation
    </div>

    <h1>
      Accès admin
    </h1>

    <p>
      Cet appareil restera connecté
      après la première identification.
    </p>


    <form id="adminLoginForm">

      <input
        id="adminPassword"
        class="admin-password"
        type="password"
        placeholder="Mot de passe"
        autocomplete="current-password"
        required
      >


      <button
        class="admin-login-btn"
        type="submit"
      >
        Se connecter
      </button>


      <div
        id="adminError"
        class="admin-error"
      >
        Mot de passe incorrect.
      </div>

    </form>

  </section>



  <!-- ADMIN CONNECTÉ -->

  <section
    id="dashboardArea"
    class="admin-dashboard"
  >

    <div class="admin-title">

      <small>
        Mode organisateur
      </small>

      <h1>
        Americano
      </h1>

    </div>


    <div class="admin-grid">


      <a
        href="admin-participants.html"
        class="admin-card"
      >

        <span class="admin-card-icon">
          👥
        </span>

        <small>
          Joueurs
        </small>

        <strong>
          Activer / désactiver
        </strong>

      </a>


      <a
        href="admin-programmation.html"
        class="admin-card"
      >

        <span class="admin-card-icon">
          🎾
        </span>

        <small>
          Tournoi
        </small>

        <strong>
          Programmer les matchs
        </strong>

      </a>


      <a
        href="admin-classement.html"
        class="admin-card"
      >

        <span class="admin-card-icon">
          🏆
        </span>

        <small>
          Résultats
        </small>

        <strong>
          Classement
        </strong>

      </a>


      <a
        href="index.html"
        class="admin-card"
      >

        <span class="admin-card-icon">
          👁️
        </span>

        <small>
          Public
        </small>

        <strong>
          Voir le site
        </strong>

      </a>


    </div>


    <button
      id="logoutBtn"
      class="logout-btn"
      type="button"
    >
      Déconnecter cet appareil
    </button>

  </section>


</main>


<script
  type="module"
  src="header.js"
></script>


<script type="module">

  import {

    isAdminConnected,
    loginAdmin,
    logoutAdmin

  } from "./admin-session.js";


  const loginArea =
    document.getElementById(
      "loginArea"
    );


  const dashboardArea =
    document.getElementById(
      "dashboardArea"
    );


  const loginForm =
    document.getElementById(
      "adminLoginForm"
    );


  const passwordInput =
    document.getElementById(
      "adminPassword"
    );


  const errorBox =
    document.getElementById(
      "adminError"
    );


  const logoutBtn =
    document.getElementById(
      "logoutBtn"
    );



  function refreshPageState() {

    if (
      isAdminConnected()
    ) {

      loginArea.style.display =
        "none";

      dashboardArea.classList.add(
        "visible"
      );

    }

    else {

      loginArea.style.display =
        "block";

      dashboardArea.classList.remove(
        "visible"
      );

    }

  }



  loginForm.addEventListener(

    "submit",

    event => {

      event.preventDefault();


      const success =
        loginAdmin(
          passwordInput.value
        );


      if (success) {

        errorBox.classList.remove(
          "visible"
        );

        /*
         * Recharge pour rendre immédiatement
         * actif le logo Jul'Yana du header.
         */

        window.location.reload();

      }

      else {

        errorBox.classList.add(
          "visible"
        );

        passwordInput.select();

      }

    }

  );



  logoutBtn.addEventListener(

    "click",

    () => {

      logoutAdmin();

      window.location.href =
        "index.html";

    }

  );


  refreshPageState();

</script>


</body>

</html>
